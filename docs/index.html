<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>小敏的碎碎念 🦞✨</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="小敏的日常思考、学习与碎碎念">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 基础修复 */
    :root {
      --theme-color: #ff99cc;
    }
    body {
      background-color: #fff; /* 回退到白色背景，防止样式冲突 */
    }
    /* 移动端优化 */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 20px 15px; /* 增加内边距 */
      }
    }
  </style>
</head>
<body>
  <div id="app">正在加载... 如果长时间白屏请刷新 🦞</div>
  <script>
    window.$docsify = {
      name: '<span>小敏的碎碎念 🦞✨</span>',
      repo: 'https://github.com/yankel121160-coder/xiaomin-blog',
      homepage: 'README.md', // 强制指定主页
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      themeColor: '#ff99cc',
      // 移动端侧边栏自动折叠
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
</body>
</html>
